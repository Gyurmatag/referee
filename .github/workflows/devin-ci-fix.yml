name: Devin CI fix

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
      DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      REPO: ${{ github.repository }}
    steps:
      - name: Start Devin session from CI failure
        run: |
          if [ -z "$DEVIN_API_KEY" ] || [ -z "$DEVIN_ORG_ID" ]; then
            echo "Devin secrets are not set; skip auto-fix."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          payload = {
            "prompt": (
              f"CI failed on {os.environ['REPO']}. Open {os.environ['RUN_URL']}. "
              "Use playbook !referee-ci. Fix the smallest real failure and open or update a PR. "
              "Do not commit secrets."
            ),
            "title": f"CI fix {os.environ['REPO']}",
            "tags": ["referee", "ci-fix"],
            "repos": [os.environ["REPO"]],
            "max_acu_limit": 40,
          }
          req = urllib.request.Request(
            f"https://api.devin.ai/v3/organizations/{os.environ['DEVIN_ORG_ID']}/sessions",
            data=json.dumps(payload).encode(),
            headers={
              "Authorization": f"Bearer {os.environ['DEVIN_API_KEY']}",
              "Content-Type": "application/json",
            },
            method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as res:
            print(res.read().decode())
          PY
