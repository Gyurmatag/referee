<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Team Danube - Voice Desk</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; max-width: 40rem; }
      button { padding: 0.4rem 0.8rem; }
    </style>
  </head>
  <body>
    <h1>Danube Voice Desk</h1>
    <p>Budapest Build project. Uses the OpenAI SDK, Groq inference, and ElevenLabs voice.</p>
    <button id="go">Draft brief</button>
    <pre id="out"></pre>
    <script>
      document.getElementById("go").onclick = async () => {
        const res = await fetch("/api/brief", { method: "POST" });
        document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
      };
    </script>
  </body>
</html>
